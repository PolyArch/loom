# Full SynthConfig in TOML form. Section names mirror the YAML nesting.
[synth]
strategy = "anchor"

[synth.parallelism]
cross_group = false
workers = "auto"

[synth.coverage_verifier]
parallel_match = false

[synth.cost]
mux_penalty = 2.0
demux_penalty = 2.5
carry_penalty = 3.0

[synth.anchor]
allow_intra_position_mux = true
