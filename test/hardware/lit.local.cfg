import os
import re

config.parallelism_group = "resource-intensive"

hardware_tool_cache = os.path.join(
    config.loom_src_root, "scripts", "hardware_tool_cache.py")
hardware_tool_proxy_root = os.path.join(
    config.loom_obj_root, "test", "hardware", "tool-cache-bin")
os.makedirs(hardware_tool_proxy_root, exist_ok=True)
for tool in (
    "quartus_asm",
    "quartus_fit",
    "quartus_sh",
    "quartus_sta",
    "quartus_syn",
    "verilator",
    "vivado",
    "yosys",
):
    proxy = os.path.join(hardware_tool_proxy_root, tool)
    if os.path.lexists(proxy):
        if not os.path.islink(proxy) or os.path.realpath(proxy) != hardware_tool_cache:
            lit_config.fatal("hardware tool cache proxy has an unexpected owner")
    else:
        os.symlink(hardware_tool_cache, proxy)
config.environment["LOOM_HARDWARE_TOOL_REAL_PATH"] = config.environment["PATH"]
config.environment["LOOM_HARDWARE_TOOL_WORK_ROOT"] = os.path.join(
    config.loom_obj_root, "test", "hardware", "Output"
)
config.environment["PATH"] = os.pathsep.join(
    [hardware_tool_proxy_root, config.environment["PATH"]]
)

for target in config.loom_hardware_test_targets:
    config.substitutions.insert(
        0,
        (
            "%" + re.escape(target) + r"\b",
            os.path.join(config.loom_obj_root, "test", "hardware", target),
        ),
    )

config.substitutions.insert(
    0,
    (
        "%loom-hw-probe\\b",
        os.path.join(config.loom_obj_root, "bin", "loom-hw-probe"),
    ),
)
