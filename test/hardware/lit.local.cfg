import os
import re

config.parallelism_group = "resource-intensive"

for target in config.loom_hardware_test_targets:
    config.substitutions.insert(
        0,
        (
            "%" + re.escape(target) + r"\b",
            os.path.join(config.loom_obj_root, "test", "hardware", target),
        ),
    )

config.substitutions.insert(
    0,
    (
        "%loom-hw-probe\\b",
        os.path.join(config.loom_obj_root, "bin", "loom-hw-probe"),
    ),
)
