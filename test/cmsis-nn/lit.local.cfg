# test/cmsis-nn/ is a smoke corpus driven by run_cmsis_nn_ir.sh and
# run_cmsis_nn_raise.sh -- not a lit source tree. The runners emit
# `.ll` and `.scf.mlir` artifacts under `out/`; we don't want lit to
# discover those as test files. The integration with lit goes through
# test/frontend/cmsis_nn_smoke.test and cmsis_nn_raise.test, which
# pipe the runner output into FileCheck.
config.suffixes = []
