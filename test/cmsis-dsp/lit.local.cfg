# test/cmsis-dsp/ is a smoke corpus driven by run_cmsis_dsp_ir.sh,
# run_cmsis_dsp_raise.sh, and run_cmsis_dsp_dfg.sh -- not a lit source
# tree. Each runner writes into its own subdir under `out/`
# (`out/ir/`, `out/raise/`, `out/dfg/`) so parallel lit invocations do
# not race. We don't want lit to discover those as test files. The
# integration with lit goes through test/frontend/cmsis_dsp_smoke.test,
# cmsis_dsp_raise.test, cmsis_dsp_dfg.test, and the per-runner negative
# controls, which pipe the runner output into FileCheck.
config.suffixes = []
